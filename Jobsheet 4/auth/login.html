<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Login Petugas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>SIMPUS-Mini</h1>

        <input
            type="checkbox"
            id="nav-toggle"
            class="nav-toggle"
        >

        <label
            for="nav-toggle"
            class="nav-toggle-label"
        >
            &#9776;
        </label>

        <nav>
            <ul>
                <li>
                    <a href="../index.html">Beranda</a>
                </li>
                <li>
                    <a href="../buku/list.html">Daftar Buku</a>
                </li>
                <li>
                    <a href="login.html">Login</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Masuk ke Sistem (Petugas)</h2>
            <p>Silakan masukkan kredensial akun petugas perpustakaan.</p>

            <form action="../index.html" method="get">
                <p>
                    <label for="username">Nama Pengguna / Email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Contoh: petugas@simpus.local"
                        required
                    >
                </p>

                <p>
                    <label for="password">Kata Sandi</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan kata sandi"
                        required
                    >
                </p>

                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>

</body>
</html>
